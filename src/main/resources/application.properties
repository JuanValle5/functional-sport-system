spring.application.name=functional-sport-system
# URL de conexión a la base de datos PostgreSQL (puerto por defecto: 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/fs_db

# Credenciales de acceso
spring.datasource.username=postgres
spring.datasource.password=1287985dbc

# Driver de PostgreSQL (opcional en versiones modernas de Spring Boot, pero recomendado)
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
# ddl-auto define qué hacer con las tablas (update, create, create-drop, validate, none)
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola (útil para desarrollo)
spring.jpa.show-sql=true

# Formatear el SQL para que sea más legible en los logs
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de PostgreSQL (Hibernate lo detecta automáticamente, pero se puede especificar)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
